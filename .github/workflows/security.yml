name: PHP lint and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_mysql, sodium, fileinfo
          tools: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/smoke.php
      - name: Ban shipped executables and secret files
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env$|.*\.(exe|dll|msi|bat|ps1|phar|zip|pem|key)$)'; then echo 'Blocked artifact/secret'; exit 1; fi
