name: ZapApi - Validar API movel V1 via HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp_mobile_live.yml
      - bin/whatsapp_mobile_live.py
permissions:
  contents: read
jobs:
  mobile-https:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar roteamento e acesso nao autenticado
        run: python3 bin/whatsapp_mobile_live.py
