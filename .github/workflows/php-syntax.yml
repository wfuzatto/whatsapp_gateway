name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PHP syntax
        shell: bash
        run: |
          php -v
          find . -type f -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n 1 php -l
