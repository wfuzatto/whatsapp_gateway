name: PHP syntax and table prefix

on:
  push:
  pull_request:

jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PHP syntax
        shell: bash
        run: |
          php -v
          find . -type f -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n 1 php -l
      - name: Verify whatsapp_ table prefix in schema and PHP
        run: php tests/check_table_prefix.php
