name: WhatsApp - Publicar FTP em public_html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp_ftp_test.yml

permissions:
  contents: read

concurrency:
  group: whatsapp-ftp-public-html
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar arquivos de execucao em /public_html/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Conferir sintaxe PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Conferir sintaxe Python
        run: python3 -c "import ast; ast.parse(open('bin/whatsapp_ftp_public_html.py', encoding='utf-8').read())"

      - name: Publicar em /public_html/ (com backup de arquivos existentes)
        env:
          FTP_SERVER: ftp.zapapi1.hospedagemdesites.ws
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: '21'
          FTP_PROTOCOL: ftp
          FTP_PATH: /public_html/
        run: python3 bin/whatsapp_ftp_public_html.py
