name: WhatsApp - Auditoria do FTP antes da recuperacao
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp_ftp_audit.yml
      - bin/whatsapp_ftp_audit.py
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validar Python
        run: python3 -c "import ast; ast.parse(open('bin/whatsapp_ftp_audit.py',encoding='utf-8').read())"
      - name: Conferir diretorios FTP sem alterar arquivos
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 bin/whatsapp_ftp_audit.py
