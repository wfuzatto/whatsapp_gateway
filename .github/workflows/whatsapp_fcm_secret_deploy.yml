name: WhatsApp - Instalar credencial privada FCM

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Digite INSTALAR_FCM para instalar a credencial fora de public_html
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'INSTALAR_FCM'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar cliente SSH seguro
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass openssh-client

      - name: Conferir sintaxe do instalador
        run: python3 -m py_compile bin/whatsapp_fcm_secret_deploy.py

      - name: Enviar credencial por SFTP com chave do servidor fixada
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          SFTP_HOST: ftp.zapapi1.hospedagemdesites.ws
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 bin/whatsapp_fcm_secret_deploy.py

