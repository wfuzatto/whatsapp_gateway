name: WhatsApp - Atualizar apenas o painel Meta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp_meta_patch.yml
      - bin/whatsapp_meta_patch.py
      - src/whatsapp_MetaPanel.php
      - public/whatsapp_meta_panel.php
permissions:
  contents: read
concurrency:
  group: whatsapp-ftp-public-html
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe PHP
        run: php -l src/whatsapp_MetaPanel.php && php -l public/whatsapp_meta_panel.php
      - name: Verificar sintaxe Python
        run: python3 -c "import ast; ast.parse(open('bin/whatsapp_meta_patch.py', encoding='utf-8').read())"
      - name: Publicar dois arquivos com backup
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 bin/whatsapp_meta_patch.py
